<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福建奶龙中学 · 开屏</title>
<meta name="description" content="开屏动画（个人兴趣向同人站点，非官方）。点击进入晋江市季延中学官网。">
<meta property="og:title" content="福建奶龙中学 · 开屏">
<link rel="icon" href="assets/icon.png" type="image/png">

<style>
  /* ==========================================================================
     1. 复古艺术色彩体系与排版变量 (Vintage Editorial Tokens)
     ========================================================================== */
  :root {
    /* 纸张与背景色：奶油黄与旧羊皮纸层次 */
    --bg-cream: #efe6d5;
    --bg-cream-deep: #e2d4bc;
    --bg-paper-card: #f7f1e5;

    /* 核心复古色板：深棕、砖红、橄榄绿、奶龙暖赭黄 */
    --ink-dark: #231813;
    --ink-brown: #4e3b30;
    --ink-muted: #7a6456;
    --brick-red: #8e2c1d;
    --brick-red-dk: #691e12;
    --olive-green: #485738;
    --olive-muted: rgba(72, 87, 56, 0.16);
    --ochre-yellow: #d89a36;
    --ochre-soft: rgba(216, 154, 54, 0.22);

    /* 兼容原变量命名并映射为复古色值 */
    --gold: #8e2c1d;
    --gold-lt: #d89a36;
    --gold-dim: rgba(78, 59, 48, 0.32);

    /* 边框与阴影 */
    --border-hairline: rgba(35, 24, 19, 0.18);
    --border-strong: rgba(35, 24, 19, 0.45);
    --shadow-soft: 0 14px 34px rgba(35, 24, 19, 0.16), 0 3px 10px rgba(35, 24, 19, 0.08);
    --shadow-card: 0 18px 42px rgba(30, 18, 12, 0.22), 0 2px 6px rgba(30, 18, 12, 0.12);

    /* 中英混排字体栈 */
    --font-serif-cn: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "FangSong", "SimSun", Georgia, serif;
    --font-serif-en: "Baskerville", "Playfair Display", "Times New Roman", Georgia, serif;
    --font-sans-cn: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "Courier Prime", "Courier New", "STFangsong", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background-color: var(--bg-cream);
    background-image:
      radial-gradient(ellipse 90% 85% at 32% 45%, rgba(251, 246, 236, 0.75) 0%, rgba(239, 230, 213, 0.4) 55%, rgba(212, 195, 168, 0.85) 100%),
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(78, 59, 48, 0.03) 31px, rgba(78, 59, 48, 0.03) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(78, 59, 48, 0.03) 31px, rgba(78, 59, 48, 0.03) 32px);
    color: var(--ink-dark);
    overflow: hidden;
    font: 14px/1.75 var(--font-serif-cn);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* ==========================================================================
     2. 背景肌理：微尘纸张颗粒、柔和暗角与复古印刷外框
     ========================================================================== */
  #starfield {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.45;
  }
  #starfield i {
    position: absolute;
    background: var(--ink-brown);
    border-radius: 50%;
    animation: tw 7s ease-in-out infinite;
  }
  #starfield i:nth-child(3n) {
    background: var(--brick-red);
  }
  #starfield i:nth-child(5n) {
    background: var(--olive-green);
  }
  @keyframes tw {
    50% { opacity: 0.08; transform: scale(0.85); }
  }

  /* 纸张噪点纹理与暖调柔和光晕 */
  #glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(680px 540px at 26% 42%, rgba(216, 154, 54, 0.14) 0%, transparent 70%),
      radial-gradient(820px 640px at 74% 52%, rgba(72, 87, 56, 0.10) 0%, transparent 75%),
      radial-gradient(900px 680px at 50% 108%, rgba(142, 44, 29, 0.12) 0%, transparent 68%);
  }
  #glow::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.28;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
  }

  /* 复古画报外框（双线印刷线框与折角标记） */
  #frame {
    position: fixed;
    inset: 22px;
    pointer-events: none;
    z-index: 6;
    border: 1px solid var(--border-hairline);
    box-shadow: inset 0 0 0 4px var(--bg-cream), inset 0 0 0 5px rgba(78, 59, 48, 0.12);
  }
  #frame::before {
    content: "ARCHIVE FOLIO · EST. JIYAN / NAILONG CHRONICLE";
    position: absolute;
    top: -9px;
    left: 36px;
    padding: 0 12px;
    background: var(--bg-cream);
    font: 600 10px/1.4 var(--font-serif-en);
    letter-spacing: 0.28em;
    color: var(--olive-green);
  }
  #frame::after {
    content: "NO. 09 — FUJIAN EDITION";
    position: absolute;
    bottom: -9px;
    right: 36px;
    padding: 0 12px;
    background: var(--bg-cream);
    font: 600 10px/1.4 var(--font-serif-en);
    letter-spacing: 0.24em;
    color: var(--brick-red);
  }
  #frame span {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--brick-red);
    opacity: 0.75;
  }
  #frame span:nth-child(1) { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  #frame span:nth-child(2) { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  #frame span:nth-child(3) { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  #frame span:nth-child(4) { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* ==========================================================================
     3. 桌面端：右侧复古胶片相册墙 (非对称构图，偏右排布)
     ========================================================================== */
  #deck {
    position: fixed;
    inset: 0;
    z-index: 2;
    perspective: 1800px;
    perspective-origin: 68% 50%;
    pointer-events: none;
    transition: opacity 1.2s ease, filter 1.2s ease;
  }

  /* 柔和纸张渐变遮罩：保障左侧主视觉区域阅读清晰度 */
  #deck::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(239, 230, 213, 0.96) 0%, rgba(239, 230, 213, 0.86) 36%, rgba(239, 230, 213, 0.25) 64%, transparent 100%);
    opacity: 0;
    animation: shadowFadeIn 1.4s 4.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  @keyframes shadowFadeIn {
    to { opacity: 1; }
  }

  /* 将九宫格视觉重心向右偏移至 67% 处，与左侧排版形成画报对页关系 */
  #deck .dcard {
    position: absolute;
    top: 50%;
    left: 67%;
    width: min(21vw, 290px);
    aspect-ratio: 3 / 2;
    transform: translate(-50%, -50%);
    transform-origin: 50% 50%;
    transition: opacity 1.1s ease, filter 1.1s ease;
    will-change: transform, opacity;
  }

  /* 复古拍立得相纸装裱质感 */
  #deck .dcard i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 3px;
    background-color: var(--bg-paper-card);
    background-size: cover;
    background-position: center;
    padding: 8px 8px 22px 8px;
    border: 1px solid rgba(78, 59, 48, 0.28);
    box-shadow:
      0 16px 36px rgba(35, 24, 19, 0.24),
      0 2px 6px rgba(35, 24, 19, 0.14),
      inset 0 0 0 8px var(--bg-paper-card);
    filter: sepia(0.24) contrast(0.95) brightness(0.97) saturate(0.85);
    animation: flipIn 1.5s cubic-bezier(0.22, 0.7, 0.2, 1) both;
    animation-delay: var(--d);
  }

  @keyframes flipIn {
    0%   { transform: translate(var(--tx0), var(--ty0)) translateZ(-650px) rotateZ(var(--rz0)) scale(0.45); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: translate(calc(var(--tx) * 0.58), calc(var(--ty) * 0.76)) translateZ(var(--tz)) rotateZ(var(--rz)) rotateY(var(--ry)) scale(0.84); opacity: 1; }
  }

  #deck.spread .dcard i {
    animation: flipIn 1.5s cubic-bezier(0.22, 0.7, 0.2, 1) both, drift 11s 3.2s ease-in-out infinite alternate;
  }

  @keyframes drift {
    to { transform: translate(calc(var(--tx2) * 0.58), calc(var(--ty2) * 0.76)) scale(0.87); }
  }

  #deck.dim {
    opacity: 0.42;
    filter: sepia(0.38) contrast(0.88) blur(1.5px);
  }

  #deck.clear {
    opacity: 0.16;
    filter: sepia(0.45) contrast(0.85) blur(2px);
  }

  /* ==========================================================================
     4. 手机端：复古装裱相框轮播（加速过渡响应）
     ========================================================================== */
  #deck-m {
    position: fixed;
    top: 63%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 82vw;
    max-width: 390px;
    aspect-ratio: 3 / 2;
    z-index: 2;
    pointer-events: none;
    display: none;
  }

  #deck-m .mcard {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transform: scale(0.94) rotate(-1.5deg);
    /* 加快手机轮播过渡动画，使快节奏切换更干脆流畅 */
    transition: opacity 0.55s ease, transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: opacity, transform;
  }

  #deck-m .mcard:nth-child(even) {
    transform: scale(0.94) rotate(1.5deg);
  }

  #deck-m .mcard i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    overflow: hidden;
    background-color: var(--bg-paper-card);
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(78, 59, 48, 0.35);
    box-shadow:
      0 18px 38px rgba(35, 24, 19, 0.22),
      0 0 0 8px var(--bg-paper-card),
      0 0 0 9px rgba(78, 59, 48, 0.22);
    filter: sepia(0.22) contrast(0.96) saturate(0.88);
  }

  #deck-m .mcard i img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #deck-m .mcard.on {
    opacity: 1;
    transform: scale(1) rotate(-0.8deg);
  }

  #deck-m.holding .mcard.on {
    opacity: 0.28;
    transform: scale(0.96) rotate(0deg);
    filter: sepia(0.4) blur(1.5px);
  }

  #deck-m.clearing .mcard {
    opacity: 0.14;
    transition: opacity 1.2s ease;
  }

  /* ==========================================================================
     5. 主体视觉舞台：左侧复古报刊专栏排版 (Editorial Masthead)
     ========================================================================== */
  #stage {
    position: fixed;
    inset: 22px;
    z-index: 5;
    display: grid;
    grid-template-columns: minmax(320px, 46%) 1fr;
    grid-template-rows: auto 1fr auto;
    align-items: start;
    text-align: left;
    padding: 5.5vh 5vw 4.5vh;
    pointer-events: none;
  }
  #stage > * {
    pointer-events: auto;
  }

  /* 顶部打字机引言：老式铅字手稿栏风格 */
  #welcome {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 2.4em;
    padding: 8px 16px 8px 14px;
    margin-bottom: 3vh;
    background: var(--bg-cream);
    border-left: 3px solid var(--brick-red);
    border-top: 1px solid var(--border-hairline);
    border-right: 1px solid var(--border-hairline);
    border-bottom: 1px solid var(--border-hairline);
    box-shadow: 0 6px 20px rgba(35, 24, 19, 0.06);
    font-family: var(--font-serif-cn);
    font-size: clamp(16px, 1.55vw, 22px);
    font-weight: 600;
    color: var(--ink-dark);
    letter-spacing: 0.08em;
    line-height: 1.5;
    opacity: 0;
    animation: fadeUp 0.9s 0.4s ease forwards;
  }
  #welcome::before {
    content: "QUOTE //";
    margin-right: 12px;
    font: 700 10px/1 var(--font-mono);
    letter-spacing: 0.16em;
    color: var(--olive-green);
    padding: 3px 6px;
    background: var(--olive-muted);
    border-radius: 2px;
  }
  #typed {
    display: inline;
    white-space: nowrap;
    color: var(--brick-red-dk);
    text-shadow: 0 1px 0 rgba(247, 241, 229, 0.9);
  }
  #caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    margin-left: 6px;
    background: var(--brick-red);
    vertical-align: -0.15em;
    animation: caretBlink 1.1s steps(1, end) infinite;
  }
  @keyframes caretBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.12; }
  }

  /* 校徽与校名主体：档案特刊主视觉 (支持 mascot_1 溢出层叠) */
  #hero {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 28px 32px 30px;
    background: rgba(247, 241, 229, 0.88);
    border: 1px solid var(--border-strong);
    box-shadow:
      0 20px 50px rgba(35, 24, 19, 0.12),
      inset 0 0 0 3px var(--bg-paper-card),
      inset 0 0 0 4px var(--border-hairline);
    transform: translateY(12px);
    opacity: 0;
    animation: zoomIn 1.2s 4.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    position: relative;
    overflow: visible; /* 允许吉祥物 mascot_1 从卡片右侧溢出层叠 */
  }
  /* 档案卡片右上角编号装饰 */
  #hero::before {
    content: "SPECIMEN · 01 / MONOGRAPH";
    position: absolute;
    top: 14px;
    right: 28px;
    font: 600 10px/1 var(--font-mono);
    letter-spacing: 0.18em;
    color: var(--ink-muted);
    z-index: 2;
  }
  @keyframes zoomIn {
    to { transform: translateY(0); opacity: 1; }
  }

  /* 卡片右侧溢出的吉祥物立绘 (mascot_1.png) - 提升至 z-index: 20 确保位于整个画面的最顶层，不会被任何边框遮挡 */
  #heroMascot {
    position: absolute;
    right: -135px;
    bottom: -15px;
    width: clamp(260px, 28vw, 360px);
    height: auto;
    object-fit: contain;
    pointer-events: none;
    z-index: 20;
    filter: drop-shadow(-8px 12px 24px rgba(35, 24, 19, 0.28));
    animation: mascotFloat 7s 1.2s ease-in-out infinite;
  }
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  /* 校徽：火漆印章/古典徽章质感 */
  #hero .crest {
    width: clamp(72px, 6.8vw, 104px);
    height: clamp(72px, 6.8vw, 104px);
    object-fit: contain;
    display: block;
    padding: 10px;
    background: var(--bg-cream);
    border: 1px solid rgba(142, 44, 29, 0.35);
    border-radius: 50%;
    box-shadow:
      0 6px 18px rgba(35, 24, 19, 0.14),
      inset 0 0 0 3px var(--bg-paper-card),
      inset 0 0 0 4px rgba(72, 87, 56, 0.25);
    filter: sepia(0.18) contrast(1.04);
  }

  /* 校名：厚重铅字印刷宋体 */
  #schoolName {
    margin: 22px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    font-family: var(--font-serif-cn);
    font-size: clamp(32px, 4.2vw, 54px);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1.18;
    color: var(--ink-dark);
    position: relative;
    z-index: 2;
  }
  #schoolName span {
    color: var(--ink-dark);
    text-shadow: 1px 1px 0 var(--bg-paper-card), 2px 2px 0 rgba(142, 44, 29, 0.18);
    opacity: 0;
    transform: translateY(14px);
    animation: charIn 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    animation-delay: var(--d);
  }
  /* 为“奶龙”二字赋予复古砖红墨色强调 */
  #schoolName span:nth-child(3),
  #schoolName span:nth-child(4) {
    color: var(--brick-red);
  }
  @keyframes charIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 古典双横线分割 */
  #rule {
    margin: 18px 0 0;
    height: 4px;
    width: 100%;
    transform-origin: left center;
    transform: scaleX(0);
    opacity: 0;
    border-top: 2px solid var(--brick-red);
    border-bottom: 1px solid var(--olive-green);
    background: transparent;
    animation: ruleIn 0.85s 5.1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    position: relative;
    z-index: 2;
  }
  @keyframes ruleIn {
    to { opacity: 1; transform: scaleX(1); }
  }

  /* 英文刊名：西文古典衬线大写排印 */
  #en {
    margin: 14px 0 0;
    font-family: var(--font-serif-en);
    font-size: clamp(11px, 1.05vw, 13.5px);
    font-weight: 700;
    letter-spacing: 0.32em;
    color: var(--olive-green);
    opacity: 0;
    animation: fadeUp 0.8s 5.3s ease forwards;
    position: relative;
    z-index: 2;
  }

  /* 副标题标签：橄榄绿底纹档案签 */
  #tag {
    margin: 12px 0 0;
    display: inline-block;
    padding: 4px 10px;
    background: var(--olive-muted);
    border-left: 2px solid var(--olive-green);
    font-family: var(--font-serif-cn);
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--ink-brown);
    opacity: 0;
    animation: fadeUp 0.8s 5.5s ease forwards;
    position: relative;
    z-index: 2;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ==========================================================================
     6. 底部操作区：复古票根/火漆印章按钮
     ========================================================================== */
  #actions {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
    justify-self: start;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-top: 2.5vh;
    opacity: 0;
    animation: fadeUp 0.8s 5.9s ease forwards;
  }
  #count {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--ink-brown);
  }
  #count a {
    display: inline-flex;
    align-items: center;
    padding: 10px 22px;
    background: var(--brick-red);
    color: var(--bg-paper-card);
    border: 1px solid var(--ink-dark);
    box-shadow: 4px 4px 0 var(--ink-dark);
    font-family: var(--font-serif-cn);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-decoration: none;
    transition: transform 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
  }
  #count a::before {
    content: "✦";
    margin-right: 8px;
    color: var(--ochre-yellow);
    font-size: 12px;
  }
  #count a:hover {
    background: var(--olive-green);
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink-dark);
  }
  #count a:active {
    transform: translate(1px, 1px);
    box-shadow: 2px 2px 0 var(--ink-dark);
  }

  /* 底部进度条：复古砖红与赭黄双色标尺 */
  #bar {
    position: fixed;
    left: 22px;
    right: 22px;
    bottom: 22px;
    height: 4px;
    background: rgba(78, 59, 48, 0.14);
    z-index: 7;
    overflow: hidden;
  }
  #bar::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    transform-origin: left;
    transform: scaleX(0);
    background: linear-gradient(90deg, var(--olive-green) 0%, var(--brick-red) 55%, var(--ochre-yellow) 100%);
    animation: load 6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  @keyframes load {
    to { transform: scaleX(1); }
  }

  /* ==========================================================================
     7. 弹幕浮层：复古实心纸条签风格（高对比度、无黑底、不透明、自带固定主题）
     ========================================================================== */
  #danmaku {
    position: fixed;
    inset: 22px;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  .dm {
    position: absolute;
    left: 100%;
    white-space: nowrap;
    will-change: transform;
    z-index: 1;
    font-family: var(--font-serif-cn);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.25;
    padding: 4px 12px;
    border-radius: 2px;
    border: 1px solid rgba(78, 59, 48, 0.32);
    border-left-width: 4px;
    border-left-style: solid;
    box-shadow: 2px 3px 0 rgba(35, 24, 19, 0.12);
    text-shadow: none;
    filter: none;
    opacity: 0.96;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* 固定复古配色主题类（由 JS 在创建时随机指定，DOM 销毁前永不改变，彻底杜绝跳变 Bug） */
  .dm-theme-0 {
    background-color: #f7f1e5;
    color: #231813;
    border-left-color: #d89a36;
  }
  .dm-theme-1 {
    background-color: #f3ead8;
    color: #691e12;
    border-left-color: #485738;
  }
  .dm-theme-2 {
    background-color: #ebe2ce;
    color: #364428;
    border-left-color: #8e2c1d;
  }
  .dm-theme-3 {
    background-color: #f7f1e5;
    color: #5c3824;
    border-left-color: #8e2c1d;
  }
  .dm-theme-4 {
    background-color: #f4ecdc;
    color: #6e2217;
    border-left-color: #d89a36;
  }

  @keyframes dmMove {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(var(--dist), 0, 0); }
  }

  /* ==========================================================================
     8. 右上角复古留声机音符按钮 (Vintage Phonograph Music Toggle)
     ========================================================================== */
  #musicBtn {
    position: fixed;
    top: 38px;
    right: 38px;
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 8px;
    background: var(--bg-paper-card);
    color: var(--ink-dark);
    border: 1px solid var(--border-strong);
    box-shadow:
      3px 3px 0 var(--ink-dark),
      inset 0 0 0 2px var(--bg-cream);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }

  #musicBtn:hover {
    transform: translate(-1.5px, -1.5px);
    box-shadow:
      4.5px 4.5px 0 var(--ink-dark),
      inset 0 0 0 2px var(--bg-cream);
    background: var(--bg-cream);
  }

  #musicBtn:active {
    transform: translate(1px, 1px);
    box-shadow:
      1.5px 1.5px 0 var(--ink-dark),
      inset 0 0 0 2px var(--bg-cream);
  }

  /* 黑胶唱片/火漆圆盘音符底座 */
  #musicBtn .disc {
    position: relative;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--brick-red);
    color: var(--bg-paper-card);
    border: 1px solid var(--ink-dark);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 2px rgba(216, 154, 54, 0.38);
    transition: background-color 0.3s ease;
  }

  #musicBtn .note-icon {
    width: 14px;
    height: 14px;
    fill: currentColor;
    display: block;
    animation: discSpin 5.5s linear infinite;
    animation-play-state: paused;
  }

  #musicBtn.playing .disc {
    background: var(--olive-green);
  }

  #musicBtn.playing .note-icon {
    animation-play-state: running;
  }

  /* 暂停斜杠提示线 */
  #musicBtn .mute-slash {
    position: absolute;
    width: 18px;
    height: 2px;
    background: var(--bg-paper-card);
    border: 0.5px solid var(--ink-dark);
    transform: rotate(-42deg) scaleX(1);
    transition: transform 0.25s ease, opacity 0.25s ease;
    opacity: 0.92;
    pointer-events: none;
  }

  #musicBtn.playing .mute-slash {
    transform: rotate(-42deg) scaleX(0);
    opacity: 0;
  }

  #musicBtn .m-label {
    color: var(--ink-brown);
    transition: color 0.25s ease;
  }

  #musicBtn.playing .m-label {
    color: var(--olive-green);
  }

  /* 播放时的复古声波律动指示器 */
  #musicBtn .eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 10px;
  }

  #musicBtn .eq i {
    display: block;
    width: 2px;
    height: 3px;
    background: var(--brick-red);
    transition: height 0.2s ease;
  }

  #musicBtn.playing .eq i {
    animation: eqBounce 0.8s ease-in-out infinite alternate;
  }
  #musicBtn.playing .eq i:nth-child(2) {
    animation-delay: 0.22s;
    background: var(--olive-green);
  }
  #musicBtn.playing .eq i:nth-child(3) {
    animation-delay: 0.44s;
    background: var(--ochre-yellow);
  }

  @keyframes discSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes eqBounce {
    0% { height: 3px; }
    100% { height: 10px; }
  }

  /* ==========================================================================
     9. 移动端响应式布局 (≤ 860px：上下画册封面构图)
     ========================================================================== */
  @media (max-width: 860px) {
    #deck { display: none !important; }

    #musicBtn {

  /* 尊重系统减弱动态效果偏好 */

</style>

  <span class="disc" aria-hidden="true">

<!-- 外部弹幕配置文件 (DANMAKU) -->

<script>
/**
 * 核心配置项
 */
const CONFIG = {
  DEFAULT_TARGET: 'http://www.jjjy.net/',
  SCHOOL_NAME: '福建奶龙中学',
  DM_START: 8400,    // 弹幕启动毫秒
  MOBILE_SLIDE_MS: 1450, // 手机端轮播速度
  SONG_ID: '1838130295',
  SONG_START_SEC: 187
};

const params = new URLSearchParams(location.search);
const TARGET = params.get('to') || CONFIG.DEFAULT_TARGET;
const OPEN_IN = params.get('newtab') === '1' ? '_blank' : '_self';

/* ============================================================
   1. 桌面端九宫格卡片构建 (assets/campus-01.jpg ~ campus-09.jpg)
   ============================================================ */
const DESKTOP_CARDS = [
  { tx: '-34vw', ty: '-27vh', tz: '-120px', rz: '-8deg',  ry: '10deg' },
  { tx: '0vw',   ty: '-29vh', tz: '-60px',  rz: '2deg',   ry: '0deg'  },
  { tx: '34vw',  ty: '-27vh', tz: '-120px', rz: '8deg',   ry: '-10deg'},
  { tx: '-36vw', ty: '1vh',   tz: '-50px',  rz: '-4deg',  ry: '8deg'  },
  { tx: '0vw',   ty: '1vh',   tz: '0px',    rz: '0deg',   ry: '0deg'  },
  { tx: '36vw',  ty: '1vh',   tz: '-50px',  rz: '4deg',   ry: '-8deg' },
  { tx: '-33vw', ty: '29vh',  tz: '-100px', rz: '-6deg',  ry: '8deg'  },
  { tx: '0vw',   ty: '31vh',  tz: '-40px',  rz: '-2deg',  ry: '0deg'  },
  { tx: '33vw',  ty: '29vh',  tz: '-100px', rz: '6deg',   ry: '-8deg' }
].map((item, idx) => {
  const num = String(idx + 1).padStart(2, '0');
  return {
    ...item,
    src: `assets/campus-${num}.jpg`
  };
});

const deck = document.getElementById('deck');
const BASE_DELAY = 1.2;

DESKTOP_CARDS.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'dcard';
  const delay = (BASE_DELAY + i * 0.15).toFixed(2);
  card.innerHTML = `<i style="
    background-image: url('${c.src}');
    --tx0: ${c.tx}; --ty0: ${c.ty}; --rz0: ${c.rz};
    --tx: ${c.tx};  --ty: ${c.ty};  --tz: ${c.tz};
    --rz: ${c.rz};  --ry: ${c.ry};
    --tx2: calc(${c.tx} * 1.05); --ty2: calc(${c.ty} * 1.05);
    --d: ${delay}s
  "></i>`;
  deck.appendChild(card);
});

setTimeout(() => deck.classList.add('spread'), (BASE_DELAY + DESKTOP_CARDS.length * 0.15 + 1.5) * 1000);
setTimeout(() => deck.classList.add('dim'), 6100);
setTimeout(() => deck.classList.add('clear'), 9600);

/* ============================================================
   2. 手机端卡片轮播 (assets/campus-01.jpg ~ campus-06.jpg)
   ============================================================ */
const MOBILE_CARD_COUNT = 6;
const deckM = document.getElementById('deck-m');

for (let i = 1; i <= MOBILE_CARD_COUNT; i++) {
  const num = String(i).padStart(2, '0');
  const src = `assets/campus-${num}.jpg`;

  const mcard = document.createElement('div');
  mcard.className = 'mcard' + (i === 1 ? ' on' : '');
  mcard.innerHTML = `<i style="background-image: url('${src}')"><img src="${src}" alt="校园风貌" loading="eager" decoding="sync"></i>`;
  deckM.appendChild(mcard);

  const img = mcard.querySelector('img');
  if (img) {
    const fallbackList = [src, `./${src}`, `../${src}`];
    let fbIdx = 0;
    img.addEventListener('error', () => {
      fbIdx++;
      if (fbIdx < fallbackList.length) {
        img.src = fallbackList[fbIdx];
        mcard.querySelector('i').style.backgroundImage = `url('${fallbackList[fbIdx]}')`;
      }
    });
  }
}

const mCards = [...deckM.querySelectorAll('.mcard')];
let mIdx = 0;
let mTimer = null;
let mHolding = false;

function mShow(index) {
  mCards.forEach((el, k) => el.classList.toggle('on', k === index));
}

function mStart() {
  if (mTimer || mCards.length < 2) return;
  mTimer = setInterval(() => {
    if (mHolding) return;
    mIdx = (mIdx + 1) % mCards.length;
    mShow(mIdx);
  }, CONFIG.MOBILE_SLIDE_MS);
}

const mqNarrow = window.matchMedia('(max-width: 860px)');
const mqCoarse = window.matchMedia('(hover: none) and (pointer: coarse)');
const isPhone = () => mqNarrow.matches || mqCoarse.matches;

function mSync() {
  const on = isPhone();
  document.documentElement.classList.toggle('phone', on);
  if (on) {
    deck.classList.remove('spread');
    mStart();
  } else if (mTimer) {
    clearInterval(mTimer);
    mTimer = null;
  }
}

[mqNarrow, mqCoarse].forEach(m => {
  if (m.addEventListener) m.addEventListener('change', mSync);
  else if (m.addListener) m.addListener(mSync);
});
mSync();

setTimeout(() => {
  mHolding = true;
  deckM.classList.add('holding');
}, 9400);

setTimeout(() => {
  deckM.classList.add('clearing');
}, 12000);

/* ============================================================
   3. 星空与校名逐字渲染
   ============================================================ */
const nameEl = document.getElementById('schoolName');
nameEl.innerHTML = [...CONFIG.SCHOOL_NAME]
  .map((ch, i) => `<span style="--d:${(4.6 + i * 0.12).toFixed(2)}s">${ch}</span>`)
  .join('');

const sf = document.getElementById('starfield');
let starNodes = '';
for (let i = 0; i < 150; i++) {
  const size = (Math.random() * 2 + 1).toFixed(1);
  const opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
  starNodes += `<i style="
    left: ${(Math.random() * 100).toFixed(2)}%;
    top: ${(Math.random() * 100).toFixed(2)}%;
    width: ${size}px; height: ${size}px;
    opacity: ${opacity};
    animation-delay: ${(Math.random() * 3.6).toFixed(2)}s"></i>`;
}
sf.innerHTML = starNodes;

/* ============================================================
   4. 打字机文案逻辑
   ============================================================ */
const TYPED_LINES = [
  '我在季延很想你',
  '站到后面去',
  '同学我们好像没有明天了',
  '沙县小吃的扁食泡面掌管人',
  '前面没有佛 不要拜佛',
  '社店是季延最夯的食堂',
  '三年之期已到，奶龙归位'
];

(function typewriter() {
  const out = document.getElementById('typed');
  if (!out || !TYPED_LINES.length) return;

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const render = s => { out.innerHTML = esc(s).replace(/\|/g, '<br>'); };

  let li = 0, ci = 0, deleting = false;

  function step() {
    const full = TYPED_LINES[li];
    if (!deleting) {
      ci++;
      render(full.slice(0, ci));
      if (ci >= full.length) {
        deleting = true;
        return setTimeout(step, 1500);
      }
      return setTimeout(step, 170);
    }
    ci--;
    render(ci > 0 ? full.slice(0, ci) : '');
    if (ci <= 0) {
      deleting = false;
      li = (li + 1) % TYPED_LINES.length;
      return setTimeout(step, 420);
    }
    return setTimeout(step, 85);
  }

  setTimeout(step, 700);
})();

/* ============================================================
   5. 弹幕逻辑
   ============================================================ */
const dmLayer  = document.getElementById('danmaku');
let dmTimer = null, dmIdx = 0, dmLive = [], dmLanes = [];
const DM_MAX = 46;

function dmLaneTop(lane, laneH) {
  const base = isPhone() ? 0.315 : 0.045;
  return Math.round((base + lane * laneH) * window.innerHeight);
}

function spawnDanmaku(text, size, lane, laneH, dur) {
  if (!dmLayer || dmLive.length > DM_MAX) return;
  const el = document.createElement('div');
  
  const themeIdx = Math.floor(Math.random() * 5);
  el.className = `dm dm-theme-${themeIdx}`;
  
  el.textContent = text;
  el.style.top = `${dmLaneTop(lane, laneH)}px`;
  el.style.fontSize = `${size || (isPhone() ? 13.5 : 19)}px`;
  dmLayer.appendChild(el);

  const w = el.offsetWidth || 140;
  const dist = -(window.innerWidth + w + 60);
  const d = dur || (isPhone() ? 5.6 + Math.random() * 3.2 : 7 + Math.random() * 4.5);

  el.style.setProperty('--dist', `${dist}px`);
  el.style.animation = `dmMove ${d}s linear forwards`;
  dmLive.push(el);

  setTimeout(() => {
    el.remove();
    dmLive = dmLive.filter(x => x !== el);
  }, d * 1000 + 200);
}

function startDanmaku() {
  const danmakuData = (typeof DANMAKU !== 'undefined' && Array.isArray(DANMAKU)) ? DANMAKU : [];
  if (dmTimer || !danmakuData.length) return;

  const lineH = isPhone() ? 38 : 48;
  const laneH = lineH / window.innerHeight;
  const lanes = Math.max(6, Math.floor(window.innerHeight * 0.88 / lineH));
  const gap   = isPhone() ? 900 : 620;
  const step  = isPhone() ? 420 : 300;

  const pick = () => {
    let best = -1, bestT = Infinity;
    for (let i = 0; i < lanes; i++) {
      const t = dmLanes[i] || 0;
      if (t <= performance.now() && t < bestT) {
        bestT = t;
        best = i;
      }
    }
    if (best < 0) return false;

    const item = danmakuData[dmIdx % danmakuData.length];
    const dur = isPhone() ? 5.6 + Math.random() * 3.2 : 7 + Math.random() * 4.5;

    spawnDanmaku(item.t, item.size, best, laneH, dur);

    const y = dmLaneTop(best, laneH) / window.innerHeight;
    const centerDist = Math.abs(y - 0.47);
    if (centerDist < 0.3) {
      const dim = 0.45 + (centerDist / 0.3) * 0.45;
      const node = dmLive[dmLive.length - 1];
      if (node) {
        node.style.opacity = dim.toFixed(2);
      }
    }

    dmLanes[best] = performance.now() + dur * 1000 * 0.62 + gap;
    dmIdx++;
    return true;
  };

  for (let k = 0; k < 26; k++) pick();
  dmTimer = setInterval(() => {
    for (let k = 0; k < 3; k++) {
      if (!pick()) break;
    }
  }, step);
}

setTimeout(startDanmaku, CONFIG.DM_START);

/* ============================================================
   5.5 网易云背景音乐播放器
   ============================================================ */
(function initMusicPlayer() {
  const btn = document.getElementById('musicBtn');
  const label = document.getElementById('musicText');
  if (!btn) return;

  const AUDIO_SOURCES = [
    `https://music.163.com/song/media/outer/url?id=${CONFIG.SONG_ID}.mp3`,
    `https://api.injahow.cn/meting/?type=url&id=${CONFIG.SONG_ID}`,
    `https://api.i-meto.com/meting/api?server=netease&type=url&id=${CONFIG.SONG_ID}`
  ];

  const audio = new Audio();
  audio.preload = 'auto';
  audio.loop = false;

  let srcIdx = 0;
  let hasSeekedInitial = false;
  let userPaused = false;

  function loadSource(idx) {
    srcIdx = idx;
    audio.src = AUDIO_SOURCES[srcIdx];
    audio.load();
  }

  function syncUI(playing) {
    btn.classList.toggle('playing', playing);
    btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    if (label) {
      label.textContent = playing ? 'BGM · ON' : 'BGM · PAUSE';
    }
  }

  function ensureInitialSeek() {
    if (hasSeekedInitial) return;
    try {
      if (audio.readyState >= 1) {
        audio.currentTime = CONFIG.SONG_START_SEC;
        hasSeekedInitial = true;
      }
    } catch (e) {}
  }

  audio.addEventListener('loadedmetadata', ensureInitialSeek);
  audio.addEventListener('canplay', ensureInitialSeek);

  audio.addEventListener('play', () => {
    ensureInitialSeek();
    syncUI(true);
  });

  audio.addEventListener('pause', () => {
    syncUI(false);
  });

  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  });

  audio.addEventListener('error', () => {
    if (srcIdx + 1 < AUDIO_SOURCES.length) {
      hasSeekedInitial = false;
      loadSource(srcIdx + 1);
      if (!userPaused) tryAutoplay();
    }
  });

  let unlockBound = false;
  function bindUnlockEvents() {
    if (unlockBound) return;
    unlockBound = true;
    const unlock = (e) => {
      if (e && btn.contains(e.target)) {
        cleanupUnlock();
        return;
      }
      if (!userPaused && audio.paused) {
        ensureInitialSeek();
        audio.play().then(cleanupUnlock).catch(() => {});
      } else {
        cleanupUnlock();
      }
    };
    const cleanupUnlock = () => {
      ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
        document.removeEventListener(ev, unlock, { capture: true })
      );
    };
    ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
      document.addEventListener(ev, unlock, { capture: true, passive: true })
    );
  }

  function tryAutoplay() {
    ensureInitialSeek();
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        ensureInitialSeek();
        syncUI(true);
      }).catch(() => {
        syncUI(false);
        bindUnlockEvents();
      });
    }
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.paused) {
      userPaused = false;
      ensureInitialSeek();
      audio.play().catch(() => {});
    } else {
      userPaused = true;
      audio.pause();
    }
  });

  loadSource(0);
  tryAutoplay();
})();

/* ============================================================
   6. 页面跳转与按键交互
   ============================================================ */
const targetText = TARGET.replace(/^https?:\/\//, '').replace(/\/$/, '');
const targetLabel = document.getElementById('targetLabel');
if (targetLabel) {
  targetLabel.href = TARGET;
  targetLabel.textContent = `${targetText}【进入网站】`;
  if (OPEN_IN === '_blank') targetLabel.target = '_blank';
}

let isLeaving = false;
function navigate() {
  if (isLeaving) return;
  isLeaving = true;
  if (dmTimer) clearInterval(dmTimer);
  dmLive.forEach(el => {
    el.style.transition = 'opacity 0.4s ease';
    el.style.opacity = '0';
  });
  document.body.style.transition = 'opacity 0.5s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    window.location.href = TARGET;
  }, 420);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Enter') navigate();
});
</script>
